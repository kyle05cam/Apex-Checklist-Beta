<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Aviation</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apex">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/579/579268.png">
    <link rel="manifest" href="./manifest.json">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B0D17]">
    <div id="root"></div>

    <script type="text/babel">
        // Global helper for icons
        window.lucide = lucide;
    </script>

    <script type="text/babel" src="./cessna172s_checklist.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('Apex Checklist: Offline System Active');
          }).catch(err => {
            console.error('Offline Registration Failed:', err);
          });
        });
      }
    </script>
</body>
</html>
